<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <title>מחשבון — Collective Force</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    html, body { width: 100%; min-height: 100%; background: #f7f7f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { overflow: hidden; }
    .calculator-container { display: flex; flex-direction: column; justify-content: space-between; min-height: 100dvh; max-width: 430px; margin: 0 auto; padding: 14px 20px 24px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; height: 48px; flex: 0 0 48px; }
    .icon-btn { background: transparent; border: 0; padding: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #2b2b2b; }
    .top-right { display: flex; gap: 18px; }
    .icon-svg { width: 22px; height: 22px; stroke: #333; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .sync-line { display: none; direction: rtl; align-items: center; gap: 8px; min-height: 28px; font-size: .77rem; color: #727272; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; flex: 0 0 8px; }
    .sync-dot.good { background: #19b269; }
    .sync-dot.bad { background: #df625d; }
    .display-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; padding: 10px 10px 22px; overflow: hidden; }
    .history-view { font-size: 1.2rem; color: #757575; min-height: 1.7rem; margin-bottom: 6px; font-weight: 400; max-width: 100%; overflow-wrap: anywhere; text-align: right; }
    .main-view { font-size: clamp(2.4rem, 14vw, 4rem); font-weight: 300; color: #1a1a1a; line-height: 1.05; max-width: 100%; overflow-wrap: anywhere; text-align: right; }
    .keypad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 12px; width: 100%; }
    .btn { aspect-ratio: 1; border-radius: 50%; border: 0; outline: none; font-size: 1.85rem; font-weight: 400; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: filter .08s ease, transform .05s ease; }
    .btn:active { filter: brightness(.92); transform: scale(.96); }
    .btn-digit { background: #fff; color: #1e1e1e; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .btn-op { background: #e9e9eb; color: #2b2b2b; font-size: 1.75rem; }
    .btn-red { background: #fff; color: #e35653; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .btn-equal { background: #19b269; color: #fff; font-size: 2.1rem; box-shadow: 0 2px 6px rgba(25,178,105,.35); }
    .secret-popup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(3px); padding: 18px; }
    .popup-box { background: #fff; width: 100%; max-width: 340px; border-radius: 20px; padding: 22px 18px; box-shadow: 0 12px 30px rgba(0,0,0,.25); text-align: center; direction: rtl; }
    .popup-box h4 { font-size: 1.15rem; margin-bottom: 14px; color: #111; }
    .input-label { font-size: .82rem; color: #555; text-align: right; margin-bottom: 4px; display: block; }
    .secret-input { width: 100%; font-size: 1.15rem; text-align: center; padding: 9px; border: 1.5px solid #19b269; border-radius: 10px; outline: none; margin-bottom: 12px; }
    .popup-btns { display: flex; gap: 10px; margin-top: 6px; }
    .p-btn { flex: 1; padding: 10px; border-radius: 10px; border: 0; font-size: .95rem; cursor: pointer; }
    .p-save { background: #19b269; color: #fff; font-weight: 700; }
    .p-cancel { background: #f0f0f0; color: #444; }
    .collective-toggle { display: flex; align-items: center; justify-content: flex-start; gap: 8px; direction: ltr; font-size: .9rem; color: #333; margin: 0 0 8px; }
    .popup-note { color: #777; font-size: .74rem; line-height: 1.45; text-align: right; margin-top: 10px; }
    @media (max-height: 700px) { .calculator-container { padding-top: 8px; padding-bottom: 12px; } .keypad-grid { gap: 8px 10px; } .btn { max-height: 17vh; } .display-screen { padding-bottom: 10px; } }
  </style>
</head>
<body>
<div class="calculator-container">
  <div class="top-bar">
    <button class="icon-btn" id="historyIconBtn" aria-label="היסטוריה והגדרות קסם" title="לחיצה ארוכה: הגדרות קסם">
      <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2"/><polyline points="12 7 12 12 15 14"/></svg>
    </button>
    <div class="top-right" aria-hidden="true">
      <button class="icon-btn" tabindex="-1"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 8.5L15.5 3c-.4-.4-1-.4-1.4 0L3 14.1c-.4.4 0 1 0 1.4l5.5 5.5c.4.4 1 0 1.4 0L21 9.9c.4-.4 0-1-.4-1.4z"/><line x1="7" y1="18" x2="9" y2="16"/><line x1="10" y1="15" x2="13" y2="12"/><line x1="14" y1="11" x2="17" y2="8"/></svg></button>
      <button class="icon-btn" tabindex="-1"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M3.5 12h3l3 8 5-16 3.5 8h2.5"/></svg></button>
    </div>
  </div>
  <div class="sync-line" aria-live="polite"><span id="syncDot" class="sync-dot"></span><span id="syncStatus">בודק חיבור ל-Collective Force…</span></div>
  <div class="display-screen">
    <div class="history-view" id="calcHistory"></div>
    <div class="main-view" id="calcScreen">0</div>
  </div>
  <div class="keypad-grid">
    <button class="btn btn-red" onclick="onClear()">C</button>
    <button class="btn btn-red" onclick="onDelete()" aria-label="מחיקה"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button>
    <button class="btn btn-op" onclick="onInput('%')">%</button>
    <button class="btn btn-op" onclick="onInput('÷')">÷</button>
    <button class="btn btn-digit" onclick="onInput('7')">7</button><button class="btn btn-digit" onclick="onInput('8')">8</button><button class="btn btn-digit" onclick="onInput('9')">9</button><button class="btn btn-op" onclick="onInput('×')">×</button>
    <button class="btn btn-digit" onclick="onInput('4')">4</button><button class="btn btn-digit" onclick="onInput('5')">5</button><button class="btn btn-digit" onclick="onInput('6')">6</button><button class="btn btn-op" onclick="onInput('−')">−</button>
    <button class="btn btn-digit" onclick="onInput('1')">1</button><button class="btn btn-digit" onclick="onInput('2')">2</button><button class="btn btn-digit" onclick="onInput('3')">3</button><button class="btn btn-op" onclick="onInput('+')">+</button>
    <button class="btn btn-digit" onclick="onInput('()')">( )</button><button class="btn btn-digit" onclick="onInput('0')">0</button><button class="btn btn-digit" onclick="onInput('.')">.</button><button class="btn btn-equal" onclick="onEqual()">=</button>
  </div>
</div>
<div class="secret-popup" id="secretBox" role="dialog" aria-modal="true" aria-labelledby="secretTitle">
  <div class="popup-box">
    <h4 id="secretTitle">הגדרת קסם סודית</h4>
    <label class="input-label" for="forcedNumInput">מספר החיזוי (Force):</label>
    <input type="text" inputmode="numeric" id="forcedNumInput" class="secret-input" placeholder="למשל: 1831848449" autocomplete="off">
    <label class="input-label" for="targetClickInput">באיזו לחיצה על = להפעיל?</label>
    <input type="number" id="targetClickInput" class="secret-input" value="2" min="1" step="1">
    <label class="collective-toggle"><input type="checkbox" id="collectiveForceInput"> Collective force</label>
    <div class="popup-btns">
      <button class="p-btn p-save" onclick="saveSecret()">שמור והפעל</button>
      <button class="p-btn p-cancel" onclick="closeSecret()">ביטול</button>
    </div>
    <p class="popup-note">במצב Collective Force, לאחר שליחת הסכום מהאפליקציה השנייה, לחיצה על = תציג את החיזוי פחות הסכום. לאחר מכן לחצי על + והקלידי מספר ספרות כלשהו; הספרות שיוצגו יתחלפו לספרות הסכום, והחישוב הסופי יגיע לחיזוי.</p>
  </div>
</div>
<script>
  // אותו מזהה bin נמצא גם בקובץ collective_sum.html.
  const NPOINT_BIN_ID = 'bf376153dd8536f3966c';
  const NPOINT_API = `https://api.npoint.io/${NPOINT_BIN_ID}`;
  const SYNC_INTERVAL_MS = 4000;
  let formula = '';
  let equalClickCounter = 0;
  let forcedNumber = localStorage.getItem('magic_force') || null;
  let targetTriggerCount = parseInt(localStorage.getItem('magic_target_click'), 10) || 2;
  let collectiveForceEnabled = localStorage.getItem('magic_collective_force') === 'true';
  let collectiveAwaitingPlus = false;
  let collectiveStarted = false;
  let collectiveDigitSequence = '';
  let collectiveDigitsEntered = 0;
  let pendingCollectiveData = null;
  let activeCollectiveRunId = null;
  let pollInProgress = false;

  const screen = document.getElementById('calcScreen');
  const history = document.getElementById('calcHistory');
  const syncStatus = document.getElementById('syncStatus');
  const syncDot = document.getElementById('syncDot');

  function setSyncStatus(message, state = 'neutral') {
    syncStatus.textContent = message;
    syncDot.className = `sync-dot${state === 'good' ? ' good' : state === 'bad' ? ' bad' : ''}`;
  }
  function updateView() { screen.textContent = formula || '0'; }
  function cleanIntegerString(value) { return /^-?\d+$/.test(String(value)) ? String(value) : null; }

  function evaluateFormula(input) {
    const integerExpression = String(input).replace(/−/g, '-').replace(/\s+/g, '');
    if (/^[+-]?\d+(?:[+-]\d+)*$/.test(integerExpression)) {
      const terms = integerExpression.match(/[+-]?\d+/g) || [];
      return terms.reduce((total, term) => total + BigInt(term), 0n).toString();
    }
    const clean = String(input).replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
    const result = Function(`"use strict"; return (${clean});`)();
    if (typeof result !== 'number' || !Number.isFinite(result)) throw new Error('Invalid calculation');
    return String(result);
  }

  function validSharedPayload(data) {
    if (!data || data.status !== 'ready' || typeof data.runId !== 'string' || !data.runId ||
      !Array.isArray(data.numbers) || !data.numbers.length || !data.numbers.every(n => /^\d+$/.test(String(n))) ||
      !/^\d+$/.test(String(data.sum))) return false;
    try { return data.numbers.reduce((total, value) => total + BigInt(value), 0n) === BigInt(data.sum); }
    catch { return false; }
  }

  async function syncNpoint() {
    if (pollInProgress) return;
    pollInProgress = true;
    try {
      const response = await fetch(`${NPOINT_API}?_=${Date.now()}`, { method: 'GET', cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      if (validSharedPayload(data)) {
        const consumedRunId = localStorage.getItem('collective_consumed_run');
        if (data.runId !== consumedRunId && (!pendingCollectiveData || pendingCollectiveData.runId !== data.runId)) {
          pendingCollectiveData = { runId: data.runId, numbers: data.numbers.map(String), sum: String(data.sum) };
          localStorage.setItem('collective_pending', JSON.stringify(pendingCollectiveData));
        }
        if (data.runId === consumedRunId) {
          pendingCollectiveData = null;
          localStorage.removeItem('collective_pending');
          setSyncStatus(`המספרים מהסבב האחרון כבר שימשו (${data.sum})`, 'good');
        } else {
          setSyncStatus(`התקבל סכום ${data.sum} · ${data.numbers.length} מספרים`, 'good');
        }
      } else if (data && data.status === 'idle') {
        if (!activeCollectiveRunId) {
          pendingCollectiveData = null;
          localStorage.removeItem('collective_pending');
        }
        setSyncStatus('מחכה לשליחת מספרים מאפליקציית הקהל', 'neutral');
      } else {
        setSyncStatus('החיבור פעיל · ממתין לנתוני סבב', 'good');
      }
    } catch (error) {
      setSyncStatus('אין חיבור ל-npoint · בדקי אינטרנט וכתובת bin', 'bad');
    } finally {
      pollInProgress = false;
    }
  }

  try {
    const saved = JSON.parse(localStorage.getItem('collective_pending') || 'null');
    if (saved && validSharedPayload({ ...saved, status: 'ready' }) && saved.runId !== localStorage.getItem('collective_consumed_run')) {
      pendingCollectiveData = saved;
    }
  } catch { pendingCollectiveData = null; }
  syncNpoint();
  window.setInterval(syncNpoint, SYNC_INTERVAL_MS);

  function onInput(val) {
    if (val === '()') {
      const open = (formula.match(/\(/g) || []).length;
      const close = (formula.match(/\)/g) || []).length;
      val = (open > close && !isNaN(formula.slice(-1))) ? ')' : '(';
    }
    // תאימות להתנהגות Collective Force הישנה כאשר אין סבב שנשלח מהאפליקציה החדשה.
    if (collectiveAwaitingPlus && val === '+') {
      const target = cleanIntegerString(forcedNumber) !== null ? BigInt(forcedNumber) : null;
      const current = cleanIntegerString(formula) !== null ? BigInt(formula) : null;
      if (target !== null && current !== null) {
        const difference = target - current;
        collectiveDigitSequence = (difference < 0n ? -difference : difference).toString();
        collectiveDigitsEntered = 0;
        collectiveStarted = true;
        collectiveAwaitingPlus = false;
        formula += '+';
        updateView();
        return;
      }
      collectiveAwaitingPlus = false;
    }
    if (collectiveStarted && /^\d$/.test(val)) {
      if (collectiveDigitsEntered < collectiveDigitSequence.length) {
        const currentValue = formula.slice(0, formula.lastIndexOf('+'));
        if (collectiveDigitsEntered === 0 && BigInt(forcedNumber) < BigInt(currentValue)) formula += '−';
        formula += collectiveDigitSequence[collectiveDigitsEntered++];
        updateView();
      }
      return;
    }
    formula += val;
    updateView();
  }

  function clearMagicAfterUse() {
    forcedNumber = null;
    targetTriggerCount = 2;
    equalClickCounter = 0;
    collectiveAwaitingPlus = false;
    collectiveStarted = false;
    collectiveDigitSequence = '';
    collectiveDigitsEntered = 0;
    localStorage.removeItem('magic_force');
    localStorage.removeItem('magic_target_click');
    if (activeCollectiveRunId) {
      localStorage.setItem('collective_consumed_run', activeCollectiveRunId);
      localStorage.removeItem('collective_pending');
      activeCollectiveRunId = null;
      setSyncStatus('החישוב הושלם · מוכנה לסבב הבא', 'good');
    }
  }

  function onClear() {
    formula = '';
    history.textContent = '';
    collectiveAwaitingPlus = false;
    collectiveStarted = false;
    collectiveDigitSequence = '';
    collectiveDigitsEntered = 0;
    equalClickCounter = 0;
    activeCollectiveRunId = null;
    updateView();
  }

  function onDelete() {
    if (collectiveStarted) {
      const operatorIndex = formula.lastIndexOf('+');
      const entered = formula.slice(operatorIndex + 1).replace(/\D/g, '').length;
      if (entered <= collectiveDigitsEntered) collectiveDigitsEntered = Math.max(0, entered - 1);
    }
    formula = formula.slice(0, -1);
    updateView();
  }

  function onEqual() {
    if (!formula) return;
    if (collectiveStarted && collectiveDigitsEntered < collectiveDigitSequence.length) return;
    history.textContent = formula;
    equalClickCounter++;
    if (forcedNumber !== null && forcedNumber !== '' && equalClickCounter === targetTriggerCount) {
      if (collectiveForceEnabled) {
        const targetString = cleanIntegerString(forcedNumber);
        if (pendingCollectiveData && targetString !== null) {
          try {
            const offset = BigInt(targetString) - BigInt(pendingCollectiveData.sum);
            formula = offset.toString();
            activeCollectiveRunId = pendingCollectiveData.runId;
            collectiveAwaitingPlus = true;
            collectiveStarted = false;
            setSyncStatus('ערך הביניים מוכן', 'good');
          } catch { formula = 'שגיאה'; }
        } else {
          try {
            formula = evaluateFormula(formula);
            collectiveAwaitingPlus = true;
          } catch { formula = 'שגיאה'; }
        }
      } else {
        formula = String(forcedNumber);
        clearMagicAfterUse();
      }
    } else {
      try { formula = evaluateFormula(formula); }
      catch { formula = 'שגיאה'; }
      if (collectiveStarted || activeCollectiveRunId) clearMagicAfterUse();
    }
    updateView();
  }

  const triggerBtn = document.getElementById('historyIconBtn');
  let holdTimer;
  triggerBtn.addEventListener('touchstart', (event) => { event.preventDefault(); holdTimer = setTimeout(openSecret, 700); });
  triggerBtn.addEventListener('touchend', () => clearTimeout(holdTimer));
  triggerBtn.addEventListener('touchcancel', () => clearTimeout(holdTimer));
  triggerBtn.addEventListener('mousedown', () => { holdTimer = setTimeout(openSecret, 700); });
  triggerBtn.addEventListener('mouseup', () => clearTimeout(holdTimer));
  triggerBtn.addEventListener('mouseleave', () => clearTimeout(holdTimer));

  function openSecret() {
    document.getElementById('forcedNumInput').value = forcedNumber || '';
    document.getElementById('targetClickInput').value = targetTriggerCount || 2;
    document.getElementById('collectiveForceInput').checked = collectiveForceEnabled;
    document.getElementById('secretBox').style.display = 'flex';
  }
  function closeSecret() { document.getElementById('secretBox').style.display = 'none'; }
  function saveSecret() {
    const numVal = document.getElementById('forcedNumInput').value.trim();
    const countVal = Math.max(1, parseInt(document.getElementById('targetClickInput').value, 10) || 2);
    collectiveForceEnabled = document.getElementById('collectiveForceInput').checked;
    localStorage.setItem('magic_collective_force', String(collectiveForceEnabled));
    if (numVal !== '') {
      if (collectiveForceEnabled && cleanIntegerString(numVal) === null) {
        alert('במצב Collective Force יש להזין מספר שלם ללא נקודה עשרונית.');
        return;
      }
      if (!collectiveForceEnabled && !/^-?\d+(?:\.\d+)?$/.test(numVal)) {
        alert('יש להזין מספר תקין.');
        return;
      }
      forcedNumber = numVal;
      targetTriggerCount = countVal;
      equalClickCounter = 0;
      localStorage.setItem('magic_force', forcedNumber);
      localStorage.setItem('magic_target_click', String(targetTriggerCount));
    } else {
      forcedNumber = null;
      localStorage.removeItem('magic_force');
      localStorage.removeItem('magic_target_click');
    }
    closeSecret();
  }
</script>
</body>
</html>
